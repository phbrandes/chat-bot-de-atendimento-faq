<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chatbot de FAQ</title>
    <style>
      body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    /* 1. Configuração da Imagem de Fundo */
    background-image: url('fundo.png'); /* Certifique-se de que o nome da imagem está igualzinho aqui */
    background-size: cover; /* Faz a imagem cobrir a tela toda */
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed; /* Deixa o fundo fixo ao rolar a página */
    
    color: #ffffff; /* Texto branco para contrastar com o fundo */
    max-width: 600px; 
    margin: 40px auto; 
    padding: 20px;
    height: 100vh;
}

h2 {
    text-align: center;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* Sombra no texto para leitura mais fácil */
}

/* Efeito de Vidro na Caixa do Chat */
#chat-box { 
    background: rgba(0, 0, 0, 0.4); /* Fundo preto semi-transparente */
    backdrop-filter: blur(12px); /* O famoso efeito de desfoque/vidro! */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1); /* Borda clarinha */
    border-radius: 20px;
    height: 380px; 
    overflow-y: auto; 
    padding: 20px; 
    margin-bottom: 20px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    display: flex;
    flex-direction: column;
}

/* Bolhas de Mensagem */
.user-msg, .bot-msg {
    padding: 12px 16px;
    border-radius: 15px;
    margin-bottom: 12px;
    max-width: 80%;
    line-height: 1.4;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.user-msg { 
    background: rgba(255, 255, 255, 0.2); 
    backdrop-filter: blur(5px);
    align-self: flex-end; 
    border-bottom-right-radius: 2px; 
}

.bot-msg { 
    background: rgba(0, 0, 0, 0.6); 
    align-self: flex-start; 
    border-bottom-left-radius: 2px;
}

/* O Formato Cápsula com Efeito de Vidro no Input */
#input-container { 
    display: flex; 
    background: rgba(0, 0, 0, 0.4); /* Vidro escuro */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 50px; /* Isso faz o formato de cápsula arredondada */
    padding: 5px 5px 5px 20px; /* Espaço interno */
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

#user-input { 
    flex: 1; 
    background: transparent; /* O input fica transparente para mostrar o vidro atrás */
    border: none; 
    color: white;
    font-size: 16px;
    outline: none;
}

#user-input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

button { 
    padding: 12px 25px; 
    cursor: pointer; 
    border: none; 
    background-color: #ffffff; /* Botão branco */
    color: #000000; 
    font-weight: bold;
    border-radius: 40px; /* Botão arredondado acompanhando a cápsula */
    transition: background-color 0.3s, transform 0.1s; 
}

button:hover {
    background-color: #e0e0e0; 
    transform: scale(1.05); /* Efeito de crescer um pouquinho ao passar o mouse */
}

/* Quick Replies */
.quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.quick-replies button {
    padding: 10px 14px;
    background-color: rgba(255, 255, 255, 0.92);
    border-radius: 999px;
    font-weight: 700;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.quick-replies button:hover {
    background-color: rgba(255, 255, 255, 1);
    transform: scale(1.03);
}
    </style>
</head>

<body>

    <h2>Atendimento Virtual</h2>
    
    <div id="chat-box">
        <p class="bot-msg"><strong>Assistente:</strong> Olá! Como posso ajudar você hoje?</p>
        <div id="quick-replies" class="quick-replies">
            <button type="button" onclick="quickReply('rastreio')">📦 Rastrear Pedido</button>
            <button type="button" onclick="quickReply('prazo')">🚚 Prazo de Frete</button>
            <button type="button" onclick="quickReply('produtos')">🛍️ Ver Produtos</button>
            <button type="button" onclick="quickReply('café')">☕ Café</button>
        </div>
    </div>

    
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Digite sua pergunta..." onkeypress="verificarEnter(event)">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
// 1. Dicionário de Dúvidas Gerais
const baseDeConhecimento = {
            // Logística e Entregas
            "frete": "Nosso tempo médio de entrega é de 3 a 5 dias úteis para o Sul/Sudeste e 7 a 10 dias úteis para as demais regiões.",
            "prazo": "O prazo de entrega varia de 3 a 10 dias úteis, dependendo da sua região.",
            "pedido": "Para verificar o status da sua compra, por favor, digite o número do seu pedido com a hashtag na frente (ex: #1234).",
            "rastreio": "Você pode acompanhar o rastreio diretamente na aba 'Meus Pedidos' no topo do site.",
            
            // Pós-Venda e Confiança
            "garantia": "Nossos produtos possuem garantia de 90 dias contra defeitos de fabricação.",
            "devolução": "Você tem até 7 dias corridos após o recebimento para solicitar a devolução.",

            // Financeiro e Vendas (NOVIDADES)
            "pagamento": "Aceitamos PIX (com 5% de desconto), Boleto ou Cartão de Crédito em até 12x sem juros.",
            "cartão": "Aceitamos Cartão de Crédito das principais bandeiras em até 12x sem juros.",
            "pix": "No pagamento via PIX você ganha 5% de desconto! A aprovação é na hora.",
            "cupom": "Na sua primeira compra, use o cupom BEMVINDO10 para ganhar 10% de desconto!",
            "desconto": "Na sua primeira compra, use o cupom BEMVINDO10 para ganhar 10% de desconto!",
            "cancelar": "Para cancelar uma compra, acesse 'Meus Pedidos' e clique em 'Cancelar Pedido'. Se o pedido já foi enviado, recuse a entrega.",
            
            // Suporte Avançado (NOVIDADES)
            "humano": "Vou te transferir para um de nossos especialistas reais. Por favor, chame no WhatsApp (11) 9999-9999, de segunda a sexta.",
            "atendente": "Vou te transferir para um de nossos especialistas reais. Por favor, chame no WhatsApp (11) 9999-9999, de segunda a sexta.",
};

// 2. Dicionário de Estoque de Produtos
const estoqueProdutos = {
    // Periféricos e Acessórios
    "teclado": "Temos o Teclado Mecânico RGB switch azul a pronta entrega!",
    "mouse": "O Mouse Gamer sem fio de 10.000 DPI está em promoção. Últimas unidades!",
    "mousepad": "Temos o Mousepad Gigante (90x40cm) com bordas costuradas em estoque.",
    "headset": "O Headset Bluetooth com cancelamento de ruído está disponível nas cores preto e branco.",
    "webcam": "Temos a Webcam Full HD 1080p com microfone embutido pronta para envio.",
    "microfone": "O Microfone Condensador de mesa USB está disponível. Ideal para podcasts e lives!",

    // Monitores e Cadeiras
    "monitor": "Temos as últimas 2 unidades do Monitor 144hz IPS no estoque. Aproveite!",
    "suporte": "O Suporte Articulado de mesa para 2 monitores está disponível.",
    "cadeira": "A Cadeira Gamer ergonômica reclinável chega em nova remessa na sexta-feira.",

    // Hardware (Peças de PC)
    "ssd": "Temos SSDs NVMe de 1TB e 2TB a pronta entrega para deixar seu PC voando.",
    "memória": "Kits de Memória RAM 16GB (2x8GB) 3200MHz estão disponíveis no estoque.",
    "ram": "Kits de Memória RAM 16GB (2x8GB) 3200MHz estão disponíveis no estoque.", // Sinônimo para facilitar a busca
    "placa de vídeo": "A Placa de Vídeo RTX 4060 está esgotada. Previsão de chegada para a próxima semana.",
    "processador": "Temos o Processador Core i7 de 13ª geração a pronta entrega.",
    "placa mãe": "Placas-mãe com soquete AM4 e LGA1700 disponíveis. Qual modelo você procura?",
    "gabinete": "Temos o Gabinete Aquário com 4 ventoinhas RGB inclusas no estoque.",
    "fonte": "Fontes de 650W com selo 80 Plus Bronze disponíveis a pronta entrega.",

    // Extras e Sobrevivência Dev
    "nobreak": "O Nobreak de 1200VA está disponível para proteger seus equipamentos.",
    "hub usb": "Temos Hub USB 3.0 de 4 portas em estoque.",
    "ring light": "A Ring Light de 10 polegadas com tripé de mesa está disponível.",
    "caneca": "A Caneca Térmica inteligente que mantém seu café quente por 4 horas está em estoque!",
    "café": "Temos sim! Atualmente temos 10 pacotes do Café 3 Corações disponíveis no estoque. O combustível oficial dos devs! ☕"
};
// 3. NOVO: Dicionário de Departamentos/Categorias
const departamentos = {
    "periféricos": "Na seção de Periféricos temos: <b>teclado, mouse, mousepad, headset, webcam e microfone</b>. Sobre qual deles você quer saber o estoque?",
    "monitores": "Nessa área temos: <b>monitor, suporte e cadeira</b>. Qual deles você quer verificar?",
    "cadeiras": "Nessa área temos: <b>monitor, suporte e cadeira</b>. Qual deles você quer verificar?", // Sinônimo
    "hardware": "Em Hardware trabalhamos com: <b>SSD, memória, placa de vídeo, processador, placa mãe, gabinete e fonte</b>. Qual peça você busca?",
    "extras": "Nos Extras temos: <b>nobreak, hub USB, ring light, caneca e o nosso famoso café!</b> Sobre qual deseja saber mais?"
};

function verificarEnter(event) {
    if (event.key === "Enter") {
        enviarMensagem();
    }
}

function quickReply(texto) {
    const inputField = document.getElementById("user-input");
    inputField.value = texto;
    enviarMensagem();
}

function enviarMensagem() {

    const inputField = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");
    const textoDigitado = inputField.value;
    const mensagemUsuario = textoDigitado.toLowerCase();

    if (mensagemUsuario.trim() === "") return;

   // O código pega a mensagem do usuário, exibe e rola a tela para baixo
chatBox.innerHTML += `<p class="user-msg"><strong>Você:</strong> ${textoDigitado}</p>`;
inputField.value = ""; 
chatBox.scrollTop = chatBox.scrollHeight;

// -> ADICIONE ISSO AQUI: Cria o ID único e exibe o "digitando..."
const idDigitando = "digitando-" + Date.now();
chatBox.innerHTML += `<p class="bot-msg" id="${idDigitando}"><em>Assistente está digitando...</em></p>`;
chatBox.scrollTop = chatBox.scrollHeight;

    let respostaFinal = "";
    let respostaEncontrada = false;

    // Normaliza para reconhecer variações com/sem acento
    const normalizar = (str) => str
        .normalize('NFD')
        .replace(/\p{Diacritic}/gu, '')
        .toLowerCase();

    const mensagemNormalizada = normalizar(textoDigitado);

    // PASSO EXTRA: Quando a pessoa pergunta “quais produtos estão disponíveis / o que tem na loja”
    // em vez de listar tudo (pode ficar enorme), pedimos a categoria/departamento.
    if (
        (
            mensagemNormalizada.includes('quais') ||
            mensagemNormalizada.includes('quais produtos') ||
            mensagemNormalizada.includes('produtos') ||
            mensagemNormalizada.includes('o que tem') ||
            mensagemNormalizada.includes('tem na loja') ||
            mensagemNormalizada.includes('na loja') ||
            mensagemNormalizada.includes('no estoque') ||
            mensagemNormalizada.includes('estoque')
        ) &&

        (
            mensagemNormalizada.includes('dispon') ||
            mensagemNormalizada.includes('disponivel') ||
            mensagemNormalizada.includes('disponiveis') ||
            mensagemNormalizada.includes('tem') ||
            mensagemNormalizada.includes('o que tem') ||
            mensagemNormalizada.includes('produtos')
        )
    ) {
        respostaFinal = "Qual departamento/categoria você está procurando? (Periféricos, Monitores, Cadeiras, Hardware ou Extras)";
        respostaEncontrada = true;
    }


// Detecta qual departamento a pessoa quer (ex: “periféricos”, “monitores”, “cadeiras”, “hardware”, “extras”)
    if (!respostaEncontrada) {
        for (const [depChave, depTexto] of Object.entries(departamentos)) {
            if (mensagemNormalizada.includes(depChave)) {
                respostaFinal = depTexto;
                respostaEncontrada = true;
                break;
            }
        }
    }

    // Tratamento separado para capturar frases mais soltas como "o que tem na loja"
    if (!respostaEncontrada) {

        const temNaLoja =
            mensagemNormalizada.includes('o que tem na loja') ||
            mensagemNormalizada.includes('o que tem na') ||
            (mensagemNormalizada.includes('o que tem') && mensagemNormalizada.includes('loja')) ||
            mensagemNormalizada.includes('o que teria no estoque') ||
            mensagemNormalizada.includes('o que tem no estoque') ||
            mensagemNormalizada.includes('no estoque') ||
            mensagemNormalizada.includes('estoque');

        if (temNaLoja) {
            const listaProdutos = Object.keys(estoqueProdutos)
                .map((k) => k.charAt(0).toUpperCase() + k.slice(1))
                .join(', ');

            respostaFinal = `Temos estes produtos na loja: ${listaProdutos}.`;
            respostaEncontrada = true;
        }
    }



    // PASSO NOVO: Verifica se o usuário digitou um número de pedido (ex: #1234)
    // O includes("#") verifica se tem a hashtag na mensagem
    if (mensagemUsuario.includes("#")) {
        chatBox.innerHTML += `<p class="bot-msg"><strong>Assistente:</strong> Só um momento, estou consultando o status do pedido ${textoDigitado.match(/#\d+/)} no nosso sistema... <br><br>✅ <b>Status:</b> Em transporte! Previsão de entrega para os próximos 2 dias úteis.</p>`;
        respostaEncontrada = true;
    }

    // PASSO A: Procura por produtos
    if (!respostaEncontrada) {
        for (const [produto, respostaEstoque] of Object.entries(estoqueProdutos)) {
            if (mensagemUsuario.includes(produto)) {
                respostaFinal = respostaEstoque;
                respostaEncontrada = true;
                break; 
            }
        }
    }

    // PASSO B: Procura nas dúvidas gerais (agora incluindo frete médio e pedido)
    if (!respostaEncontrada) {
        for (const [palavraChave, respostaGeral] of Object.entries(baseDeConhecimento)) {
            if (mensagemUsuario.includes(palavraChave)) {
                respostaFinal = respostaGeral;
                respostaEncontrada = true;
                break;
            }
        }
    }

    // PASSO C: Resposta padrão
    if (!respostaEncontrada) {
        respostaFinal = "Desculpe, não consegui entender sua pergunta. Por favor, tente reformular ou entre em contato com nosso suporte pelo telefone (11) 1234-5678.";
    }
// O CRONÔMETRO DE 1.5 SEGUNDOS
setTimeout(() => {
    // 1. Procura aquele "digitando..." que criamos no Passo 1 e apaga ele da tela
    const avisoDigitando = document.getElementById(idDigitando);
    if (avisoDigitando) {
        avisoDigitando.remove();
    }

    // 2. Agora sim, injeta a resposta que guardamos na variável direto na tela!
    chatBox.innerHTML += `<p class="bot-msg"><strong>Assistente:</strong> ${respostaFinal}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
    
}, 1500);
}
    </script>

</body>
</html>
