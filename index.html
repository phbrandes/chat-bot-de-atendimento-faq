<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chatbot de FAQ</title>
    <style>
      body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    /* 1. Configuração da Imagem de Fundo */
    background-image: url('fundo.png'); /* Certifique-se de que o nome da imagem está igualzinho aqui */
    background-size: cover; /* Faz a imagem cobrir a tela toda */
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed; /* Deixa o fundo fixo ao rolar a página */
    
    color: #ffffff; /* Texto branco para contrastar com o fundo */
    max-width: 600px; 
    margin: 40px auto; 
    padding: 20px;
    height: 100vh;
}

h2 {
    text-align: center;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); /* Sombra no texto para leitura mais fácil */
}

/* Efeito de Vidro na Caixa do Chat */
#chat-box { 
    background: rgba(0, 0, 0, 0.4); /* Fundo preto semi-transparente */
    backdrop-filter: blur(12px); /* O famoso efeito de desfoque/vidro! */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1); /* Borda clarinha */
    border-radius: 20px;
    height: 380px; 
    overflow-y: auto; 
    padding: 20px; 
    margin-bottom: 20px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    display: flex;
    flex-direction: column;
}

/* Bolhas de Mensagem */
.user-msg, .bot-msg {
    padding: 12px 16px;
    border-radius: 15px;
    margin-bottom: 12px;
    max-width: 80%;
    line-height: 1.4;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.user-msg { 
    background: rgba(255, 255, 255, 0.2); 
    backdrop-filter: blur(5px);
    align-self: flex-end; 
    border-bottom-right-radius: 2px; 
}

.bot-msg { 
    background: rgba(0, 0, 0, 0.6); 
    align-self: flex-start; 
    border-bottom-left-radius: 2px;
}

/* O Formato Cápsula com Efeito de Vidro no Input */
#input-container { 
    display: flex; 
    background: rgba(0, 0, 0, 0.4); /* Vidro escuro */
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 50px; /* Isso faz o formato de cápsula arredondada */
    padding: 5px 5px 5px 20px; /* Espaço interno */
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

#user-input { 
    flex: 1; 
    background: transparent; /* O input fica transparente para mostrar o vidro atrás */
    border: none; 
    color: white;
    font-size: 16px;
    outline: none;
}

#user-input::placeholder {
    color: rgba(255, 255, 255, 0.6);
}

button { 
    padding: 12px 25px; 
    cursor: pointer; 
    border: none; 
    background-color: #ffffff; /* Botão branco */
    color: #000000; 
    font-weight: bold;
    border-radius: 40px; /* Botão arredondado acompanhando a cápsula */
    transition: background-color 0.3s, transform 0.1s; 
}

button:hover {
    background-color: #e0e0e0; 
    transform: scale(1.05); /* Efeito de crescer um pouquinho ao passar o mouse */
}
    </style>
</head>
<body>

    <h2>Atendimento Virtual</h2>
    
    <div id="chat-box">
        <p class="bot-msg"><strong>Assistente:</strong> Olá! Como posso ajudar você hoje?</p>
    </div>
    
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Digite sua pergunta..." onkeypress="verificarEnter(event)">
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

    <script>
        // 1. Base de conhecimento (Objeto em JavaScript, equivalente ao Dicionário do Python)
        const baseDeConhecimento = {
            "frete": "Trabalhamos com envio expresso para todo o Brasil. O prazo e valor são calculados na página do produto.",
            "garantia": "Nossos produtos possuem garantia de 90 dias contra defeitos de fabricação.",
            "estoque": "Se o produto está ativo no anúncio, temos a pronta entrega para envio imediato!",
            "devolução": "Você tem até 7 dias corridos após o recebimento para solicitar a devolução."
        };

        // Função para permitir o envio apertando a tecla "Enter"
        function verificarEnter(event) {
            if (event.key === "Enter") {
                enviarMensagem();
            }
        }

        // Função principal ativada ao clicar no botão "Enviar"
        function enviarMensagem() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const textoDigitado = inputField.value;
            const mensagemUsuario = textoDigitado.toLowerCase();

            // Se o campo estiver vazio, não faz nada
            if (mensagemUsuario.trim() === "") return;

            // Mostra a mensagem do usuário na tela
            chatBox.innerHTML += `<p class="user-msg"><strong>Você:</strong> ${textoDigitado}</p>`;

            // 2. Lógica de busca e resposta
            let respostaEncontrada = false;

            // O Object.entries transforma o objeto em um array para podermos percorrê-lo
            for (const [palavraChave, resposta] of Object.entries(baseDeConhecimento)) {
                if (mensagemUsuario.includes(palavraChave)) { // Verifica se a palavra-chave está na frase
                    chatBox.innerHTML += `<p class="bot-msg"><strong>Assistente:</strong> ${resposta}</p>`;
                    respostaEncontrada = true;
                    break; // Interrompe o loop
                }
            }

            // 3. Resposta padrão
            if (!respostaEncontrada) {
                chatBox.innerHTML += `<p class="bot-msg"><strong>Assistente:</strong> Desculpe, não entendi. Você pode me perguntar sobre frete, garantia, estoque ou devolução.</p>`;
            }

            // Limpa o campo de texto e rola o chat para a última mensagem
            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>
</html>
